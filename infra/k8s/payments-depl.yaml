apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-depl
spec:
  replicas: 1
  selector:
    #Finds the pod with the label app: payments
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: dulina786/payments
          env:
            - name: KAFKA_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKERS
              value: 'kafka-srv:9092'
            - name: MONGO_URI
              value: mongodb://payments-mongo-srv:27017/payments
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: STRIPE_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_KEY

---
#Create a service for the payments-depl
apiVersion: v1
kind: Service
metadata:
  name: payments-srv
spec:
  #Find the pod with the label app: ticketpaymentss
  selector:
    app: payments
  type: ClusterIP #What this does is that it creates a service that is only accessible from within the cluster
  ports:
    - name: payments
      port: 3000
      targetPort: 3000
