name: tests-tickets

on: 
  pull_request

jobs: 
  build:
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd tickets && npm ci
      - name: Run tests
        run: cd orders && npm run test:ci
